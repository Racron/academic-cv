hugoblox:
  schema: "2.0"
  identity:
    name: W. X. Chiok
    type: person
    tagline: Biodiversity Conservation | NUS
    description: Wen Xuan (Shane) is a National Geographic Explorer and Ecologist with over 7 years of experience in field ecology, wildlife trade, and environmental consulting.
  theme:
    mode: system
    pack: dracula
    colors:
      primary: "#0b1826"
      secondary: "#1c2430"
      neutral: "slate"
    colors_dark:
      primary: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
